# Fragment of the shared ~/openpak/deploy/traefik/dynamic.yml on the primary host.
# These blocks belong in the shared dynamic.yml (routers under http.routers,
# services under http.services), not in a separate file. Copied verbatim from
# the live file; keep in sync when the shared file changes.
tcp:
  routers:
    x360-wlid:
      # Windows Live ID login of the 360 user logon: TLS terminated by x360-xuacs (RSA key exchange).
      entryPoints:
      - console
      rule: HostSNI(`nexus.passport.com`) || HostSNI(`login.live.com`)
      priority: 100
      service: x360-wlid-tls
      tls:
        passthrough: true
  services:
    x360-wlid-tls:
      loadBalancer:
        servers:
        - address: openpak-x360-xuacs:10443
http:
  routers:
    x360-liveinfo-web:
      entryPoints:
      - web
      rule: PathPrefix(`/liveinfo`)
      priority: 40
      service: x360-liveinfo-http
    x360-xuacs-web:
      entryPoints:
      - web
      rule: PathPrefix(`/xuacs`)
      priority: 40
      service: x360-xuacs-http
    x360-xsig-web:
      entryPoints:
      - web
      rule: PathPrefix(`/xsig`)
      priority: 40
      service: x360-xuacs-http
    x360-xedl-web:
      entryPoints:
      - web
      rule: PathPrefix(`/xedl`)
      priority: 40
      service: x360-xuacs-http
    x360-notice-web:
      entryPoints:
      - web
      rule: Host(`xncsi.xboxlive.com`) || Host(`notice.xbox.com`)
      priority: 30
      service: x360-notice-http
  services:
    x360-liveinfo-http:
      loadBalancer:
        servers:
        - url: http://openpak-x360-liveinfo:10025
    x360-xuacs-http:
      loadBalancer:
        servers:
        - url: http://openpak-x360-xuacs:10005
    x360-notice-http:
      loadBalancer:
        servers:
        - url: http://openpak-x360-notice:8080
